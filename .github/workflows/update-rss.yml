name: Update JRI Asia RSS Feed

on:
  schedule:
    # 毎週金曜日 中国時間13:00 (= UTC 5:00)
    - cron: '0 5 * * 5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedgen
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run RSS generator
        run: python generate_rss.py
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jri_asia_rss.xml
          git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          git push
